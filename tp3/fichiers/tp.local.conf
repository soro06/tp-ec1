server {
    listen 443 ssl;
    server_name www.tp.local;

    ssl_certificate /etc/nginx/tls/serveur_chaine.crt;
    ssl_certificate_key /etc/nginx/tls/serveur.key;

    # Versions TLS autorisées
    ssl_protocols TLSv1.2 TLSv1.3;

    # Suites TLS 1.2 : AEAD avec confidentialité persistante
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';

    # Laisser le client choisir l'ordre des suites TLS 1.2
    ssl_prefer_server_ciphers off;

    # Désactiver les tickets de reprise de session
    ssl_session_tickets off;

    # Authentification mutuelle des clients
    ssl_client_certificate /etc/nginx/tls/racine.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_crl /etc/nginx/tls/crls.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        return 200 "Bonjour $ssl_client_s_dn\n";
    }
}
